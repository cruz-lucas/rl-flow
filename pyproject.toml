[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-flow"
version = "0.1.0"
description = "Schema-driven node workflow framework for reinforcement learning experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "sqlmodel>=0.0.21",
  "jinja2>=3.1",
  "typer>=0.12",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "jax>=0.4; sys_platform != 'linux'",
  "jax[cuda13]>=0.4; sys_platform == 'linux'",
  "optax>=0.2",
  "navix>=0.7.4",
  "tfp-nightly==0.26.0.dev20260524",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "tabulate>=0.9",
  "ruff>=0.6",
]
analysis = [
  "pandas>=2.2",
  "matplotlib>=3.8",
  "tabulate>=0.9",
]
mlflow = ["mlflow>=2.12"]
docs = [
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
]

[project.scripts]
rlflow = "rlflow.cli:app"

[tool.setuptools.packages.find]
where = [
  "packages/core",
  "packages/builtin_components",
  "apps/api",
]
include = ["rlflow*", "rlflow_builtin*", "rlflow_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/core",
  "packages/builtin_components",
  "apps/api",
]
markers = [
  "bench: performance benchmark smoke tests (see scripts/bench.py)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["site", "runs", ".venv", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Baseline ignore set — intentionally lenient so the gate can be introduced
# without a flood of churn, then ratcheted tighter over time:
#   E501 line-too-long: the codebase has many long, deliberate lines
#         (e.g. JAX scan-carry unpacks); enable once those are wrapped.
#   UP042 replace-str-enum: JobState / RunStatusState are `(str, Enum)`; moving
#         them to StrEnum is serialization-sensitive, deferred to its own change.
ignore = ["E501", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["rlflow", "rlflow_builtin", "rlflow_api"]

[tool.ruff.lint.flake8-bugbear]
# Typer and FastAPI idiomatically use callables as argument defaults
# (`x: int = typer.Option(...)`, `x = Depends(...)`); these are not B008 bugs.
extend-immutable-calls = [
  "typer.Option",
  "typer.Argument",
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
]

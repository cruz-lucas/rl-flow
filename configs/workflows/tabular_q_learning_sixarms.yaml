name: tabular_q_learning_sixarms
description: Tabular Q-learning on the SixArms exploration MDP.
execution:
  backend: local
  cluster: null
  options: {}
metadata:
  experiment_id: tabular-q-learning-sixarms
nodes:
- id: env
  component: builtin.env.sixarms
  position: {x: 120, y: 160}
  config:
    success_probabilities: [1.0, 0.85, 0.7, 0.5, 0.3, 0.1]
    arm_rewards: [0.0, 50.0, 133.0, 300.0, 800.0, 1660.0, 6000.0]
- id: agent
  component: builtin.agent.q_learning_tabular
  position: {x: 120, y: 20}
  config:
    learning_rate: 0.1
    discount: 0.99
    initial_q: 0.0
- id: policy
  component: builtin.policy.epsilon_greedy
  position: {x: 120, y: 300}
  config:
    epsilon: 0.1
    eval_epsilon: 0.0
- id: runner
  component: builtin.runner.tabular_jax
  position: {x: 480, y: 160}
  config:
    seed: 0
    train_episodes: 60
    train_steps: null
    max_episode_steps: 30
    eval_episodes: 5
    checkpoint_freq: null
    checkpoint_dir: checkpoints
    save_final_checkpoint: false
edges:
- {from_node: env, from_port: environment, to_node: runner, to_port: environment}
- {from_node: agent, from_port: agent, to_node: runner, to_port: agent}
- {from_node: policy, from_port: policy, to_node: runner, to_port: policy}

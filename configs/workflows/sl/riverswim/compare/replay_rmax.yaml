name: sl_riverswim_compare__replay_rmax
description: S&L riverswim replay-based optimistic Q-learning (R-Max variant).
execution:
  backend: local
  cluster: null
  options: {}
metadata:
  experiment_id: sl-riverswim-compare--replay_rmax
nodes:
- id: env
  component: builtin.env.riverswim
  position:
    x: 120
    y: 160
  config:
    num_states: 6
    start_state: 0
    random_start: true
    p_left: 0.1
    p_stay: 0.6
    p_right: 0.3
    easy_reward: 5.0
    hard_reward: 10000.0
    common_reward: 0.0
- id: agent
  component: builtin.agent.replay_rmax_tabular
  position:
    x: 120
    y: 20
  config:
    learning_rate: 0.1
    discount: 0.95
    known_count_threshold: 15
    rmax_v_max: 200000.0
- id: replay
  component: builtin.replay.tabular_uniform
  position:
    x: 300
    y: 320
  config:
    capacity: 5000
    batch_size: 32
    min_size: 1
    updates_per_step: 1
    replay_until_convergence: true
    convergence_tol: 0.01
    max_replay_iters: 100
- id: runner
  component: builtin.runner.tabular_jax
  position:
    x: 480
    y: 160
  config:
    seed: 0
    train_episodes: 1
    train_steps: 5000
    max_episode_steps: 5000
    eval_episodes: 0
    checkpoint_freq: null
    checkpoint_dir: checkpoints
    save_final_checkpoint: false
edges:
- from_node: env
  from_port: environment
  to_node: runner
  to_port: environment
- from_node: agent
  from_port: agent
  to_node: runner
  to_port: agent
- from_node: replay
  from_port: replay_buffer
  to_node: runner
  to_port: replay_buffer

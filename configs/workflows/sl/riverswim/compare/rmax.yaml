name: sl_riverswim_compare__rmax
description: S&L riverswim model-based R-Max baseline.
execution:
  backend: local
  cluster: null
  options: {}
metadata:
  experiment_id: sl-riverswim-compare--rmax
nodes:
- id: env
  component: builtin.env.riverswim
  position:
    x: 120
    y: 160
  config:
    num_states: 6
    start_state: 0
    random_start: true
    p_left: 0.1
    p_stay: 0.6
    p_right: 0.3
    easy_reward: 5.0
    hard_reward: 10000.0
    common_reward: 0.0
- id: agent
  component: builtin.agent.rmax_tabular
  position:
    x: 120
    y: 20
  config:
    discount: 0.95
    known_count_threshold: 16
    rmax_v_max: 200000.0
    planning_iterations: 500
- id: runner
  component: builtin.runner.tabular_jax
  position:
    x: 480
    y: 160
  config:
    seed: 0
    train_episodes: 1
    train_steps: 5000
    max_episode_steps: 5000
    eval_episodes: 0
    checkpoint_freq: null
    checkpoint_dir: checkpoints
    save_final_checkpoint: false
edges:
- from_node: env
  from_port: environment
  to_node: runner
  to_port: environment
- from_node: agent
  from_port: agent
  to_node: runner
  to_port: agent

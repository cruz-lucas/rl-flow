name: sl_sixarms_compare__replay_mbie_eb
description: S&L sixarms replay-based optimistic Q-learning (MBIE-EB variant).
execution:
  backend: local
  cluster: null
  options: {}
metadata:
  experiment_id: sl-sixarms-compare--replay_mbie_eb
nodes:
- id: env
  component: builtin.env.sixarms
  position:
    x: 120
    y: 160
  config:
    success_probabilities:
    - 1.0
    - 0.15
    - 0.1
    - 0.05
    - 0.03
    - 0.01
    arm_rewards:
    - 0.0
    - 50.0
    - 133.0
    - 300.0
    - 800.0
    - 1660.0
    - 6000.0
- id: agent
  component: builtin.agent.replay_mbie_eb_tabular
  position:
    x: 120
    y: 20
  config:
    learning_rate: 0.1
    discount: 0.95
    mbie_beta: 4800.0
    rmax_v_max: 120000.0
- id: replay
  component: builtin.replay.tabular_uniform
  position:
    x: 300
    y: 320
  config:
    capacity: 5000
    batch_size: 32
    min_size: 1
    updates_per_step: 1
    replay_until_convergence: true
    convergence_tol: 1.0
    max_replay_iters: 100
- id: runner
  component: builtin.runner.tabular_jax
  position:
    x: 480
    y: 160
  config:
    seed: 0
    train_episodes: 1
    train_steps: 5000
    max_episode_steps: 5000
    eval_episodes: 0
    checkpoint_freq: null
    checkpoint_dir: checkpoints
    save_final_checkpoint: false
edges:
- from_node: env
  from_port: environment
  to_node: runner
  to_port: environment
- from_node: agent
  from_port: agent
  to_node: runner
  to_port: agent
- from_node: replay
  from_port: replay_buffer
  to_node: runner
  to_port: replay_buffer

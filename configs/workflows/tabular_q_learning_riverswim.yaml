name: tabular_q_learning_riverswim
description: Smallest reproducible experiment — tabular Q-learning on a 6-state RiverSwim chain.
execution:
  backend: local
  cluster: null
  options: {}
metadata:
  experiment_id: tabular-q-learning-riverswim
nodes:
- id: env
  component: builtin.env.riverswim
  position: {x: 120, y: 160}
  config:
    num_states: 6
    start_state: 0
    random_start: false
    p_left: 0.1
    p_stay: 0.6
    p_right: 0.3
    easy_reward: 0.005
    hard_reward: 1.0
    common_reward: 0.0
- id: agent
  component: builtin.agent.q_learning_tabular
  position: {x: 120, y: 20}
  config:
    learning_rate: 0.1
    discount: 0.99
    initial_q: 0.0
- id: policy
  component: builtin.policy.epsilon_greedy
  position: {x: 120, y: 300}
  config:
    epsilon: 0.1
    eval_epsilon: 0.0
- id: runner
  component: builtin.runner.tabular_jax
  position: {x: 480, y: 160}
  config:
    seed: 0
    train_episodes: 40
    train_steps: null
    max_episode_steps: 20
    eval_episodes: 5
    checkpoint_freq: null
    checkpoint_dir: checkpoints
    save_final_checkpoint: true
edges:
- {from_node: env, from_port: environment, to_node: runner, to_port: environment}
- {from_node: agent, from_port: agent, to_node: runner, to_port: agent}
- {from_node: policy, from_port: policy, to_node: runner, to_port: policy}

name: 19x19_fourrooms__dqn_intrinsic_reward_cfn__hpsearch
description: Random hyperparameter search over the 19x19 fourrooms dqn_intrinsic_reward_cfn workflow (400k-step trials).
sweep_id: 19x19-fourrooms-dqn-intrinsic-reward-cfn-hpsearch
workflow: ../../workflows/fourrooms/best/dqn_intrinsic_reward_cfn.yaml
method: random
num_trials: 10
seed: 0
metric:
  name: mean_train_return_last_n
  goal: maximize
  last_n: 500
execution:
  backend: slurm
  options:
    account: aip-machado
    time: "01:30:00"
    cpus_per_task: 2
    mem: 16G
    modules:
      - python/3.11
      - cuda/13.2
slurm:
  max_parallel: 10
  trials_per_task: 1
  max_array_tasks: 1000
parameters:
  train_steps:
    target: nodes.runner-4.config.train_steps
    values: [400000]
  learning_rate:
    target: nodes.agent-1.config.learning_rate
    distribution: loguniform
    minimum: 1.0e-5
    maximum: 1.0e-3
  intrinsic_reward_scale:
    target: nodes.intrinsic_reward-5.config.intrinsic_reward_scale
    distribution: loguniform
    minimum: 1.0e-2
    maximum: 1.0
  cfn_learning_rate:
    target: nodes.intrinsic_reward-5.config.cfn_learning_rate
    distribution: loguniform
    minimum: 1.0e-5
    maximum: 1.0e-2
  cfn_output_dim:
    target: nodes.intrinsic_reward-5.config.cfn_output_dim
    values: [64, 128, 256]
  intrinsic_updates_per_step:
    target: nodes.replay_buffer-3.config.intrinsic_updates_per_step
    values: [10, 25, 50]
  epsilon_decay_steps:
    target: nodes.agent-1.config.epsilon_decay_steps
    values: [100000, 200000, 350000]

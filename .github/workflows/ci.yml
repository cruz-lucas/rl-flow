name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --extra dev --extra analysis

      - name: Lint (ruff)
        run: uv run ruff check packages apps tests scripts

      - name: Format check (ruff)
        run: uv run ruff format --check packages apps tests scripts

      - name: Type check (mypy, core package)
        run: uv run mypy packages/core

      - name: Tests (pytest)
        env:
          JAX_PLATFORMS: cpu
        run: uv run pytest

  web:
    name: Web (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm --filter @rl-flow/web lint

      - name: Format check (prettier)
        run: pnpm --filter @rl-flow/web format:check

      - name: Build
        run: pnpm --filter @rl-flow/web build

      - name: Tests (vitest)
        run: pnpm --filter @rl-flow/web test
